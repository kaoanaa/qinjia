      operationId: adminListManagerLeads
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [NEW, ASSIGNED, FOLLOWING, DONE] } }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200": { description: OK }

  /admin/v1/manager-leads/{leadId}/assign:
    post:
      tags: [admin]
      summary: |
        派单给管家（managerId=后台管理员）：状态 NEW→ASSIGNED；复用 IM 由管家向用户发起 1v1 会话
        （accountImport 保证双方账号存在，conversationCreate + 系统欢迎语读 copywriting 配置），回写 convId。
      operationId: adminAssignManagerLead
      parameters:
        - { name: leadId, in: path, required: true, schema: { type: string, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [managerId]
              properties:
                managerId: { type: string, format: int64 }
      responses:
        "200":
          description: 已派单并发起会话
          content:
            application/json:
              schema:
                type: object
                properties:
                  leadId: { type: string, format: int64 }
                  status: { type: string }
                  convId: { type: string }
        "409":
          description: 该用户已有跟进中的留资（一人一条约束）

  /admin/v1/manager-leads/{leadId}/status:
    put:
      tags: [admin]
      summary: 留资状态流转（ASSIGNED→FOLLOWING→DONE，结案）
      operationId: adminUpdateManagerLeadStatus
      parameters:
        - { name: leadId, in: path, required: true, schema: { type: string, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [FOLLOWING, DONE] }
      responses:
        "200": { description: OK }

  /admin/v1/config:
    get:
      tags: [admin]
      summary: 配置项清单（§11 全集 key + 当前值，Verify「全部参数可后台改」入口）
      operationId: adminListConfigs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    configKey: { type: string }
                    value: { type: object }
                    updatedAt: { type: string, format: date-time }

  /admin/v1/config/{key}:
    get:
      tags: [admin]
      summary: 读配置项
      operationId: adminGetConfig
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  configKey: { type: string }
                  value: { type: object }
    put:
      tags: [admin]
      summary: 更新配置项（保存即失效缓存 + 写 AdminAuditLog；红线 I1 唯一写入口）
      operationId: adminUpdateConfig
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: object }
      responses:
        "200": { description: 已生效 }

  /admin/v1/ops-slots:
    get:
      tags: [admin]
      summary: 运营位管理
      operationId: adminListOpsSlots
      responses:
        "200": { description: OK }
    post:
      tags: [admin]
      summary: 新建/更新运营位
      operationId: adminUpsertOpsSlot
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpsSlot" }
      responses:
        "200": { description: 已保存 }

  /admin/v1/tickets:
    get:
      tags: [admin]
      summary: 工单列表（举报投诉/退款/反馈，按 SLA 倒计时排序）
      operationId: adminListTickets
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, PROCESSING, CLOSED] } }
      responses:
        "200": { description: OK }

  /admin/v1/tickets/{ticketId}:
    put:
      tags: [admin]
      summary: 工单处理（状态流转+回复；写 AdminAuditLog）
      operationId: adminUpdateTicket
      parameters:
        - { name: ticketId, in: path, required: true, schema: { type: string, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [OPEN, PROCESSING, CLOSED] }
                handlerNote: { type: string }
      responses:
        "200": { description: OK }

  /admin/v1/audit/certifications:
    get:
      tags: [admin]
      summary: 实名复核队列（§5.13：人脸核身通过记录抽查）
      operationId: adminListCertifications
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200": { description: OK }

  /admin/v1/audit/certifications/{certId}:
    post:
      tags: [admin]
      summary: 实名复核裁决（REVOKE 清 idCardNoHash 并冻结 active 额度；写 AdminAuditLog）
      operationId: adminReviewCertification
      parameters:
        - { name: certId, in: path, required: true, schema: { type: string, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [CONFIRM, REVOKE] }
                reason: { type: string }
      responses:
        "200": { description: 已裁决 }

  /admin/v1/im/risk-events:
    get:
      tags: [admin]
      summary: IM 风控台（拦截记录：明文联系方式/敏感词/鉴黄）
      operationId: adminListRiskEvents
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200": { description: OK }

  /admin/v1/dashboard/funnel:
    get:
      tags: [admin]
      summary: 数据看板（注册/实名/解锁/付费/退款/裂变漏斗，§5.13）
      operationId: adminDashboardFunnel
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  register: { type: integer }
                  realnamePassed: { type: integer }
                  unlocks: { type: integer }
                  paidOrders: { type: integer }
                  paidAmountCent: { type: integer }
                  refunds: { type: integer }
                  invitedRewarded: { type: integer }

  /admin/v1/reconciliation/run:
    post:
      tags: [admin]
      summary: 支付对账日切（§6.6）：比对微信账单与本地 PAID 订单，返回差异报告（只读，写 AdminAuditLog）
      operationId: adminRunReconciliation
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, pattern: '^\d{8}$' }, description: YYYYMMDD，缺省=昨日 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string }
                  billCount: { type: integer }
                  localCount: { type: integer }
                  missingInSystem: { type: array, items: { type: string } }
                  missingInBill: { type: array, items: { type: string } }
                  amountMismatch: { type: array, items: { type: string } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    page: { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
    size: { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }

  responses:
    Unauthorized:
      description: 未登录/Token 过期
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 无权限（如未解锁）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        code: { type: integer, description: HTTP 状态码 }
        message: { type: string, description: 可直接展示的中文文案（中老年口语化） }
        errorCode: { type: string, description: 机器码，如 COMMITMENT_REQUIRED / RISK_CONFIRM_REQUIRED / REALNAME_REQUIRED }

    User:
      type: object
      properties:
        id: { type: string, format: int64 }
        nickname: { type: string }
        phoneMasked: { type: string, description: 138****1234 }
        relation: { type: string, enum: [FATHER, MOTHER, SELF] }
        memberLevel: { type: string, enum: [NONE, TRIAL, PAID, INTENTION] }
        memberExpireAt: { type: string, format: date-time, nullable: true }
        realnamePassed: { type: boolean }
        inviteCode: { type: string }

    ProfileUpsert:
      type: object
      required: [relation, gender, birthYear, heightCm, education, occupation, residenceCity]
      properties:
        relation: { type: string, enum: [FATHER, MOTHER, SELF] }
        gender: { type: string, enum: [MALE, FEMALE] }
        birthYear: { type: integer, minimum: 1900, maximum: 2020 }
        heightCm: { type: integer, minimum: 100, maximum: 250 }
        education: { type: string, enum: [JUNIOR_HIGH, HIGH_SCHOOL, VOCATIONAL, COLLEGE, BACHELOR, MASTER, DOCTOR] }
        occupation: { type: string, maxLength: 40 }
        incomeRange: { type: string, enum: [BELOW_5K, R5K_10K, R10K_20K, R20K_50K, ABOVE_50K, UNDISCLOSED] }
        residenceCity: { type: string }
        residenceDistrict: { type: string }
        hometown: { type: string }
        hukou: { type: string }
        housing: { type: string, enum: [OWNED_FULL, OWNED_MORTGAGE, NONE, UNDISCLOSED] }
        car: { type: string, enum: [OWNED, NONE, UNDISCLOSED] }
        intro: { type: string, maxLength: 500, description: 家长评语 }
        photoObjectKeys: { type: array, items: { type: string }, maxItems: 9 }
        maritalStatus: { type: string, enum: [UNMARRIED, DIVORCED, WIDOWED, UNDISCLOSED] }

    ProfileFull:
      description: 本人视角完整档案
      allOf:
        - $ref: "#/components/schemas/ProfileUpsert"
        - type: object
          properties:
            id: { type: string, format: int64 }
            matchNo: { type: string }
            isActive: { type: boolean }
            auditStatus: { type: string, enum: [DRAFT, PENDING, APPROVED, REJECTED] }
            rejectReason: { type: string, nullable: true }
            isMaritalVerified: { type: boolean }
            singleCommitmentSignedAt: { type: string, format: date-time, nullable: true }
            publishedAt: { type: string, format: date-time, nullable: true }
            consentStatus: { type: string, enum: [NOT_REQUIRED, PENDING, DONE], description: 关系≠本人时的子女授权态 }

    ProfileCard:
      type: object
      description: 推荐流卡片（§5.3 字段集；照片打码；分页 <500ms）
      properties:
        profileId: { type: string, format: int64 }
        matchNo: { type: string }
        gender: { type: string, enum: [MALE, FEMALE] }
        birthYear: { type: integer }
        memberBadge: { type: boolean }
        maritalVerifiedBadge: { type: string, enum: [VERIFIED, UNVERIFIED], description: 绿标/灰标（§6.3） }
        residenceCity: { type: string }
        heightCm: { type: integer }
        education: { type: string }
        occupation: { type: string }
        incomeRange: { type: string }
        housing: { type: string }
        car: { type: string }
        introDigest: { type: string, description: 家长评语摘要 }
        blurredAvatarUrl: { type: string, description: 打码头像（限时签名） }
        isTodayOnly: { type: boolean, description: 30% 轮换卡“仅今日”（D4） }
        todayOnlyTip: { type: string, nullable: true, description: 仅轮换卡下发的话术（copywriting 配置） }
        unlockState: { type: string, enum: [locked, active, expired], description: 当前生效档案对该卡片的关系态 }

    ProfilePublicDetail:
      allOf:
        - $ref: "#/components/schemas/ProfileCard"
        - type: object
          properties:
            agentNickname: { type: string, description: 如“熊家长(母亲)”（§1.2） }
            relation: { type: string, enum: [FATHER, MOTHER, SELF] }
            realnameSeal: { type: boolean, description: “已完成实名”印章 }
            residenceDistrict: { type: string }
            hometown: { type: string }
            hukou: { type: string }
            intro: { type: string }
            photos:
              type: array
              description: 未解锁=全部打码签名 URL；解锁后清晰（服务端裁决，红线 I3）
              items:
                type: object
                properties:
                  url: { type: string }
                  blurred: { type: boolean }
            unverifiedWarnTop: { type: string, nullable: true, description: 未核验档案置顶警示（copywriting 配置下发） }
            contactVisible: { type: boolean, description: 解锁且未过期才可见 }
            favorited: { type: boolean }
            prevMatchNo: { type: string, nullable: true, description: 当前推荐序上一个（§5.4 上下滑切换；不在序内为 null） }
            nextMatchNo: { type: string, nullable: true, description: 当前推荐序下一个 }

    QuotaBalance:
      type: object
      description: 多笔额度 FEFO 视图（D11/D12）
      properties:
        totalRemaining: { type: integer }
        frozenTotal: { type: integer, description: 未实名冻结量（用例 11） }
        limitLabel: { type: string, description: 展示用，如 “8/10”“23/30” }
        batches:
          type: array
          description: 按 expireAt 升序（FEFO 扣减顺序）
          items:
            type: object
            properties:
              quotaId: { type: string, format: int64 }
              source: { type: string, enum: [NEWBIE, INVITE, PAID] }
              remaining: { type: integer }
              status: { type: string, enum: [FROZEN, ACTIVE, EXPIRED] }
              expireAt: { type: string, format: date-time }

    UnlockCheck:
      type: object
      properties:
        state: { type: string, enum: [already_unlocked, quota_available, need_payment, realname_required] }
        targetMaritalVerified: { type: boolean }
        riskConfirmRequired: { type: boolean, description: 未核验→需二次确认（用例 13） }
        oncePriceCent: { type: integer, description: 配置下发（unlock_once_price） }
        expireAt: { type: string, format: date-time, nullable: true }

    UnlockResult:
      type: object
      properties:
        unlockId: { type: string, format: int64 }
        payType: { type: string, enum: [QUOTA, ONCE, COUPON] }
        quotaRemainAfter: { type: integer }
        expireAt: { type: string, format: date-time, description: 恒 created+30d（D12） }
        conversation: { $ref: "#/components/schemas/Conversation" }
        contact:
          type: object
          description: 双向可见（用例 2：被动方免操作可见，不扣额度）
          properties:
            wechat: { type: string }
            phone: { type: string, description: 服务端解密一次性下发 }

    UnlockRecord:
      type: object
      properties:
        id: { type: string, format: int64 }
        direction: { type: string, enum: [initiated_by_me, granted_to_me] }
        targetProfile: { type: string, description: matchNo + 摘要 }
        payType: { type: string, enum: [QUOTA, ONCE, COUPON, FREE_GRANT] }
        status: { type: string, enum: [ACTIVE, EXPIRED, REFUNDED] }
        createdAt: { type: string, format: date-time }
        expireAt: { type: string, format: date-time }

    Conversation:
      type: object
      properties:
        id: { type: string, format: int64 }
        imConvId: { type: string }
        counterpart:
          type: object
          description: 会话头：对方代理人身份+徽章+编号+子女摘要（§5.6）
          properties:
            userId: { type: string, description: 对方 IM identifier（=userId，发消息/建会话必需） }
            profileId: { type: string, description: 对方生效档案 id（联系升级三动作入参） }
            nickname: { type: string }
            relation: { type: string }
            memberBadge: { type: boolean }
            matchNo: { type: string }
            childDigest: { type: string, description: 如“女·95年·杭州·170cm·研究生·设计师” }
        lastMsgAt: { type: string, format: date-time, nullable: true }
        lastMsgDigest: { type: string, nullable: true }
        unlockExpireAt: { type: string, format: date-time, description: 过期禁发（D3） }
        canSend: { type: boolean }
        unreadCount: { type: integer, description: 对方发来且未读的消息数 }

    ContactActionResult:
      type: object
      description: 接触升级结果；行为已留痕（ContactActionLog，退款判定 D7）
      properties:
        action: { type: string, enum: [EXCHANGE_WECHAT, CALL_PHONE, SEND_PHOTO] }
        loggedAt: { type: string, format: date-time }
        cardSent: { type: boolean }
        phone: { type: string, nullable: true, description: 仅 CALL_PHONE 且服务端校验解锁有效期内返回（红线 I3，前端隐藏不算数） }
        photoUrl: { type: string, nullable: true, description: 仅 SEND_PHOTO：限时签名清晰原图 URL }

    MemberPlan:
      type: object
      properties:
        planId: { type: string }
        name: { type: string }
        days: { type: integer }
        quota: { type: integer }
        amountCent: { type: integer }
        originalAmountCent: { type: integer, nullable: true }

    MemberCard:
      type: object
      properties:
        level: { type: string, enum: [NONE, TRIAL, PAID, INTENTION] }
        expireAt: { type: string, format: date-time, nullable: true }
        quota: { $ref: "#/components/schemas/QuotaBalance" }
        privileges:
          type: array
          description: 权益项（后台可配，§5.9）
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              enabled: { type: boolean }
        renewRemind:
          type: object
          description: 到期前 2/7 天提醒节点状态（§5.11）
          properties:
            nextRemindAt: { type: string, format: date-time, nullable: true }
            couponIssued: { type: boolean }

    PrepayOrder:
      type: object
      properties:
        orderId: { type: string, format: int64 }
        outTradeNo: { type: string }
        amountCent: { type: integer }
        couponDeductCent: { type: integer }
        confirmRequired: { type: boolean, description: ≥大额阈值需短信二次确认（§5.10） }
        paySignParams: { type: object, description: wx.requestPayment 参数 }

    Order:
      type: object
      properties:
        id: { type: string, format: int64 }
        type: { type: string, enum: [MEMBER, UNLOCK_ONCE] }
        amountCent: { type: integer }
        payStatus: { type: string, enum: [CREATED, PAID, CLOSED] }
        refundStatus: { type: string, enum: [NONE, REQUESTED, REFUNDING, REFUNDED, REJECTED] }
        paidAt: { type: string, format: date-time, nullable: true }

    UserCoupon:
      type: object
      properties:
        id: { type: string, format: int64 }
        name: { type: string }
        scope: { type: string, enum: [UNLOCK, MEMBER] }
        amountCent: { type: integer }
        minAmountCent: { type: integer }
        status: { type: string, enum: [UNUSED, USED, EXPIRED] }
        expireAt: { type: string, format: date-time }
        expireInMs: { type: integer, description: 距过期毫秒数（倒计时组件数据源；服务端读取时过期兜底 status=EXPIRED、expireInMs=0） }

    Referral:
      type: object
      properties:
        inviteeMasked: { type: string, description: 脱敏昵称/手机 }
        rewardStatus: { type: string, enum: [PENDING, REWARDED, REJECTED], description: 被邀请人实名通过后 REWARDED（D10，用例 12） }
        rewardedAt: { type: string, format: date-time, nullable: true }

    OpsSlot:
      type: object
      properties:
        id: { type: string, format: int64 }
        type: { type: string, enum: [BANNER, POPUP, TAB_CENTER] }
        content: { type: object, description: 文案/图片/跳转配置 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        sort: { type: integer }
        enabled: { type: boolean }

    SystemNotification:
      type: object
      properties:
        id: { type: string, format: int64 }
        category: { type: string, enum: [audit, expire, activity, reward, risk, greet] }
        title: { type: string }
        body: { type: string }
        readFlag: { type: boolean }
        createdAt: { type: string, format: date-time }

    Ticket:
      type: object
      properties:
        id: { type: string, format: int64 }
        type: { type: string, enum: [FEEDBACK, COMPLAINT, REPORT, REFUND] }
        content: { type: string }
        status: { type: string, enum: [OPEN, PROCESSING, CLOSED] }
        slaDeadline: { type: string, format: date-time }
        handlerNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    NotifyPref:
      type: object
      properties:
        switches:
          type: object
          properties:
            review: { type: boolean }
            expireRemind: { type: boolean }
            activity: { type: boolean }
            rewardArrived: { type: boolean }
        subscribeAuthStatus: { type: string, enum: [UNKNOWN, GRANTED, DENIED] }

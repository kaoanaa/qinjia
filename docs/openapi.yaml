                targetProfileId: { type: string, format: int64, description: type=UNLOCK_ONCE 必填 }
                userCouponId: { type: string, format: int64 }
      responses:
        "201":
          description: 预下单完成（≥¥500 先走短信二次确认，响应 confirmRequired=true）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrepayOrder" }

  /api/v1/orders/{orderId}:
    get:
      tags: [member]
      summary: 订单状态轮询
      operationId: getOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /api/v1/orders/{orderId}/refund-request:
    post:
      tags: [member]
      summary: |
        用户发起退款申请（§6.5）：校验订单可退性（会员单：已支付未退；单次解锁单：24h 内违规下架可全退+返额度，
        已交换微信/已拨打电话/已过期不退）→ 订单 refundStatus=REQUESTED + 建 REFUND 工单（SLA 48h 首响）。
        最终金额由后台裁决（/admin/v1/orders/{orderId}/refund）按公式执行原路退回。
      operationId: createRefundRequest
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "201":
          description: 已受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: int64 }
                  ticketId: { type: string, format: int64 }
                  estimatedRefundCent: { type: integer, description: 试算金额（§6.5 公式，下限 0） }


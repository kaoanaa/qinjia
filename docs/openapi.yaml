  /admin/v1/orders/{orderId}/refund:
    post:
      tags: [admin]
      summary: |
        退款裁决（§6.5 公式服务端实现：会员 7 天 0 消耗全退；已消耗=实付−消耗次数×挂牌价−已发券面额，下限 0；
        末 30 天不退；单次解锁 24h 违规全退+返额度、已交换微信/已拨电话不退、过期不退）。返回试算明细。
      operationId: adminRefundOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
                reason: { type: string }
      responses:
        "200":
          description: 退款执行（原路退回 3-7 工作日）
          content:
            application/json:
              schema:
                type: object
                properties:
                  refundAmountCent: { type: integer }
                  calcDetail: { type: object, description: 公式逐项（用例 7） }
                  quotaReturned: { type: boolean }
                  refundStatus: { type: string, enum: [REFUNDED, REFUNDING, REJECTED] }
                  rule: { type: string, nullable: true, description: 命中的退款规则（FULL_ZERO_CONSUME/PARTIAL_CONSUME_DEDUCT/VIOLATION_FULL_REFUND 等；未及试算即驳回时为 null） }


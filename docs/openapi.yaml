openapi: 3.0.3
info:
  title: 完美亲家 API
  description: |
    父母代子女相亲微信小程序后端契约（PRD v1.0 Step 2 产物）。
    前缀 `/api/v1`（小程序端）与 `/admin/v1`（管理端）。
    所有金额单位为**分**（int）；时间 ISO8601；鉴权 JWT Bearer。
    规则真源在 PRD 与 `reward_config` 表：凡涉及价格/时长/额度/权重/话术的响应值均为配置下发，非服务端硬编码。
  version: 0.2.0
  license: { name: Proprietary }
servers:
  - url: http://localhost:3000
    description: 本地开发
tags:
  - { name: auth, description: 登录/绑定手机 }
  - { name: profile, description: 建档与多档案管理 }
  - { name: cert, description: 实名认证与子女授权 }
  - { name: quota, description: 额度账本 }
  - { name: unlock, description: 解锁状态机（PRD §6.1） }
  - { name: feed, description: 推荐流与详情（PRD §6.2/§6.3） }
  - { name: conversation, description: 会话与消息元数据 }
  - { name: contact, description: 接触升级（交换微信/电话/照片） }
  - { name: member, description: 会员与订单 }
  - { name: coupon, description: 优惠券 }
  - { name: invite, description: 邀请裂变（P1） }
  - { name: ops, description: 运营位与营销 }
  - { name: misc, description: 消息中心/记录/搜索/工单/管家/设置 }
  - { name: admin, description: 管理后台 }

security:
  - bearerAuth: []

paths:
  # ==================== auth ====================
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 微信一键登录（code2session）；新用户自动注册并发放 frozen 体验礼（D9）
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: wx.login 临时凭证 }
                deviceFingerprint: { type: string, description: 设备指纹（防刷三唯一） }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  isNewUser: { type: boolean }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/bind-phone:
    post:
      tags: [auth]
      summary: 手机号快速验证绑定（建档前置）
      operationId: bindPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneCode]
              properties:
                phoneCode: { type: string, description: getPhoneNumber 动态令牌 }
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前用户信息（含会员态/额度摘要）
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    properties:
                      quotaBalance:
                        $ref: "#/components/schemas/QuotaBalance"

  # ==================== profile ====================
  /api/v1/profiles:
    get:
      tags: [profile]
      summary: 我的档案列表（D1 多档案）
      operationId: listMyProfiles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileFull" }
    post:
      tags: [profile]
      summary: 新建子女档案（草稿）
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpsert" }
      responses:
        "201":
          description: 创建成功（生成 matchNo）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFull" }

  /api/v1/profiles/active:
    get:
      tags: [profile]
      summary: 当前生效档案
      operationId: getActiveProfile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFull" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [profile]
      summary: 切换生效档案（不影响既有解锁与会话，D1）
      operationId: switchActiveProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId: { type: string, format: int64 }
      responses:
        "200":
          description: 切换成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFull" }

  /api/v1/profiles/{profileId}:
    parameters:
      - { name: profileId, in: path, required: true, schema: { type: string, format: int64 } }
    get:
      tags: [profile]
      summary: 档案详情（本人/预览，所见即所得）
      operationId: getMyProfile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFull" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [profile]
      summary: 编辑档案（修改后 auditStatus 重置为 PENDING 重审）
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpsert" }
      responses:
        "200":
          description: 更新成功（已进重审队列）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFull" }

  /api/v1/profiles/{profileId}/publish:
    parameters:
      - { name: profileId, in: path, required: true, schema: { type: string, format: int64 } }
    post:
      tags: [profile]
      summary: 发布档案。服务端强制校验：单身承诺书已签（红线 I4）+ 实名通过 + 子女授权（关系≠本人时）。承诺书未签 → 403 COMMITMENT_REQUIRED（用例 5）
      operationId: publishProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commitmentChecked, commitmentVersion]
              properties:
                commitmentChecked: { type: boolean, description: 本次勾选 }
                commitmentVersion: { type: string, description: 声明版本号（留痕） }
      responses:
        "200":
          description: 发布成功（进审核）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFull" }
        "403":
          description: 校验未通过（承诺书/实名/授权缺项，message 指明缺哪项）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/profiles/{profileId}/marital-proof:
    parameters:
      - { name: profileId, in: path, required: true, schema: { type: string, format: int64 } }
    post:
      tags: [profile]
      summary: 上传婚姻证明（可选，D5；objectKey 走私有桶，仅审核端可见）
      operationId: uploadMaritalProof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objectKeys:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: 已提交选审
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFull" }

  /api/v1/media/upload-token:
    post:
      tags: [profile]
      summary: 申请私有桶直传凭证（照片/证明）
      operationId: getUploadToken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bucket: { type: string, enum: [photos, marital_proof, id_card] }
                mime: { type: string }
      responses:
        "200":
          description: 返回 objectKey 与上传凭证
          content:
            application/json:
              schema:
                type: object
                properties:
                  objectKey: { type: string }
                  uploadUrl: { type: string }
                  expiresAt: { type: string, format: date-time }

  # ==================== cert ====================
  /api/v1/cert/idcard-ocr:
    post:
      tags: [cert]
      summary: 身份证 OCR（实名主体=家长或子女均可，D5；原文不落库仅存哈希+掩码）
      operationId: idCardOcr
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [objectKey]
              properties:
                objectKey: { type: string }
      responses:
        "200":
          description: OCR 结果（脱敏）
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  idCardNoMasked: { type: string }
                  certId: { type: string, format: int64 }

  /api/v1/cert/face-init:
    post:
      tags: [cert]
      summary: 发起人脸核身
      operationId: faceInit
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                certId: { type: string, format: int64 }
      responses:
        "200":
          description: 返回核身会话与跳转参数
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  verifyUrl: { type: string }

  /api/v1/cert/face-verify:
    post:
      tags: [cert]
      summary: 查询核身结果；通过则触发额度解冻（事件驱动，§3.1 H 节点）
      operationId: faceVerify
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string }
      responses:
        "200":
          description: 核身结论 + 解冻后的额度余额
          content:
            application/json:
              schema:
                type: object
                properties:
                  passed: { type: boolean }
                  quotaBalance: { $ref: "#/components/schemas/QuotaBalance" }

  /api/v1/consent/send-sms:
    post:
      tags: [cert]
      summary: 子女授权短信（关系≠本人强制，§5.2）
      operationId: sendConsentSms
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [profileId, childPhone]
              properties:
                profileId: { type: string, format: int64 }
                childPhone: { type: string }
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema:
                type: object
                properties:
                  ttlSeconds: { type: integer }

  /api/v1/consent/verify:
    post:
      tags: [cert]
      summary: 子女验证码校验 + 授权声明勾选留痕（consent_record，PIPL）
      operationId: verifyConsent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [profileId, childPhone, code, statementAccepted, statementVersion]
              properties:
                profileId: { type: string, format: int64 }
                childPhone: { type: string, description: 与 send-sms 一致；真实短信服务按 phone+scene 校验验证码归属 }
                code: { type: string }
                statementAccepted: { type: boolean }
                statementVersion: { type: string }
      responses:
        "200":
          description: 授权留痕成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  consentId: { type: string, format: int64 }
                  verifiedAt: { type: string, format: date-time }

  # ==================== quota ====================
  /api/v1/quota/balance:
    get:
      tags: [quota]
      summary: 额度余额（FEFO 多笔明细 + 汇总，D11/D12）
      operationId: getQuotaBalance
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaBalance" }

  # ==================== unlock ====================
  /api/v1/unlock/check:
    post:
      tags: [unlock]
      summary: 解锁前校验（只读，不扣费；返回当前状态与应付方式）
      operationId: checkUnlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId: { type: string, format: int64 }
      responses:
        "200":
          description: 校验结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnlockCheck" }

  /api/v1/unlock:
    post:
      tags: [unlock]
      summary: |
        执行解锁（PRD §6.1 三步校验顺序）：
        1. 已有 active 关系 → 直接放行不扣费（用例 6）；
        2. 会员有 active 额度 → FEFO 扣 1（行锁事务，红线 I2）；
        3. 否则 → 返回单次付费订单（¥19.9 走配置）或券抵扣。
        目标档案未核验婚姻 → 必须 riskConfirmed=true，否则 412 RISK_CONFIRM_REQUIRED（用例 13）。
        幂等：idempotencyKey 必填。
      operationId: unlock
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
          description: 客户端生成的幂等键
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId: { type: string, format: int64 }
                riskConfirmed: { type: boolean, default: false }
                userCouponId: { type: string, format: int64, description: 可选券抵扣 }
      responses:
        "200":
          description: 解锁成功（双向生效 30 天，D3）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnlockResult" }
        "202":
          description: 需支付：返回预下单参数，小程序调起微信支付
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [need_payment] }
                  order: { $ref: "#/components/schemas/PrepayOrder" }
        "402":
          description: 未实名 → 额度 frozen（用例 11，message 为引导话术）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "412":
          description: 未核验档案需二次风险确认
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: 触发解锁限频（§6.6，阈值读 reward_config.rate_limit，红线 I1）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/unlock/records:
    get:
      tags: [unlock]
      summary: 我的解锁记录（P1 记录页复用）
      operationId: listUnlockRecords
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UnlockRecord" }

  # ==================== feed ====================
  /api/v1/feed:
    get:
      tags: [feed]
      summary: 今日推荐流（规则 50%+随机 50%、轮换 30%“仅今日”，D4/§6.2；首屏 <500ms）
      operationId: getFeed
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileCard" }

  /api/v1/feed/history:
    get:
      tags: [feed]
      summary: 历史推荐（被轮换档案找回，可继续解锁，用例 8）
      operationId: getFeedHistory
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileCard" }

  /api/v1/feed/public/{matchNo}:
    get:
      tags: [feed]
      summary: |
        对方档案详情（§5.4）。照片按解锁状态返回（未解锁仅打码签名 URL，红线 I3）；
        未核验婚姻档案含置顶警示文案；访问即记 view_record。
      operationId: getPublicProfile
      parameters:
        - { name: matchNo, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilePublicDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/feed/public/{matchNo}/share:
    get:
      tags: [feed]
      summary: 转发微信卡片 + 海报数据（§5.4；话术读 copywriting，封面走打码签名 URL）
      operationId: getProfileShare
      parameters:
        - { name: matchNo, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  title: { type: string, description: 分享卡片标题（shareCardTitle 配置下发） }
                  pagePath: { type: string, description: 小程序落地页 path（带 matchNo） }
                  imageUrl: { type: string, description: 封面图=打码头像签名 URL }
                  poster:
                    type: object
                    description: 前端 canvas 绘制海报所需数据（编号防枚举：仅 matchNo，无 userId）
                    properties:
                      matchNo: { type: string }
                      gender: { type: string }
                      birthYear: { type: integer }
                      heightCm: { type: integer }
                      education: { type: string }
                      occupation: { type: string }
                      residenceCity: { type: string }
                      introDigest: { type: string, nullable: true }
                      tip: { type: string, description: 海报底部话术（posterTip 配置下发） }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/favorites:
    post:
      tags: [feed]
      summary: 收藏/取消收藏（切换）
      operationId: toggleFavorite
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId: { type: string, format: int64 }
      responses:
        "200":
          description: 当前收藏态
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorited: { type: boolean }

  /api/v1/greet:
    post:
      tags: [feed]
      summary: 打招呼（免费破冰，发送系统卡片；会话收件 P1）
      operationId: greet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId: { type: string, format: int64 }
      responses:
        "200":
          description: 已送达（不建立聊天权限）
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  greetCountToday: { type: integer }

  # ==================== conversation & contact ====================
  /api/v1/conversations:
    get:
      tags: [conversation]
      summary: 亲家会话列表（编号+子女摘要+最后消息+时间）
      operationId: listConversations
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  totalUnread: { type: integer, description: TabBar 角标 = 全部会话未读之和（Step 12 Verify） }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Conversation" }

  /api/v1/conversations/{convId}/read:
    post:
      tags: [conversation]
      summary: 会话已读（清未读数，进入会话即调）
      operationId: markConversationRead
      parameters:
        - { name: convId, in: path, required: true, schema: { type: string, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount: { type: integer, description: 恒为 0 }

  /api/v1/im/user-sig:
    get:
      tags: [conversation]
      summary: 腾讯云IM UserSig 签发（发消息权限由服务端回调按 unlock 状态校验，前端隐藏不算数）
      operationId: getUserSig
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sdkAppId: { type: string }
                  userSig: { type: string }

  /api/v1/im/callback:
    post:
      tags: [conversation]
      summary: IM 云端回调（BeforeSendMsg 鉴权 + 鉴黄/敏感词 + 解锁前明文联系方式拦截）
      security: []
      operationId: imCallback
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: "IM 约定响应：{ActionStatus, ErrorCode, ErrorInfo}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ActionStatus: { type: string, enum: [OK, FAIL] }
                  ErrorCode: { type: integer }
                  ErrorInfo: { type: string }

  /api/v1/contact/{profileId}/exchange-wechat:
    post:
      tags: [contact]
      summary: 交换微信（需 active 解锁；有效期内不限次；行为留痕 D7）
      operationId: exchangeWechat
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: int64 } }
      responses:
        "200":
          description: 已发送联系方式卡片
          content:
            application/json:
